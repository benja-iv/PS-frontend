<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto — SONIDO VIVO</title>
    <link rel="stylesheet" href="estilo-index.css">
</head>
<body>
    <header>
        <img src="img/logo-marca.png" width="250" alt="Logo Sonido Vivo">
        <h1>SONIDO VIVO</h1>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="novedades.html">Novedades</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="carrito.html">Carrito</a></li>
                <li><a href="login.html">Ingresar</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contáctanos</h2>
            <p>¿Tienes dudas sobre un producto o necesitas asesoría? Escríbenos y te responderemos a la brevedad.</p>
            
            <form action="#" method="post">
                <div>
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div>
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="asunto">Asunto:</label>
                    <input type="text" id="asunto" name="asunto" required>
                </div>

                <div>
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
                </div>

                <button type="submit">Enviar mensaje</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Sonido Vivo 2026. Todos los derechos reservados.</p>
    </footer>
    
    <script src="Validacion.js"></script>
    <script src="logica-contacto.js"></script>
</body>
</html>
